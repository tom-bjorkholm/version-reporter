[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "versionreporter"
version = "0.3"
authors = [
  { name="Tom Björkholm", email="klausuler_linnet0q@icloud.com" },
]
description = "Report versions on main packages used in program."
readme = "README_pypi.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "versions", "version reporting", "dependencies"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]

[project.urls]
"Source code" = "https://bitbucket.org/tom-bjorkholm/version-reporter"

[tool.pytest.ini_options]
pythonpath = [
  "example/src",
]

[tool.mypy]
mypy_path = [
  "example/src",
]
